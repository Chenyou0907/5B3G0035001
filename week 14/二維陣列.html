<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>作業2：二維陣列</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <div id="table-container"></div>
    </div>
    <script>
        const data = [
            ["姓名", "國文", "英文", "數學"],
            ["王大同", 85, 88, 77],
            ["林麥可", 99, 86, 89],
            ["張淑芬", 75, 92, 86]
        ];

        document.write('<table>');
        for(let i = 0; i < data.length; i++) {
            document.write('<tr>');
            for(let j = 0; j < data[i].length; j++) {
                if(i === 0) {
                    document.write('<th>' + data[i][j] + '</th>');
                } else {
                    document.write('<td>' + data[i][j] + '</td>');
                }
            }
            document.write('</tr>');
        }
        document.write('</table>');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>作業2：二維陣列</title>
    <style>
        body {
            font-family: "微軟正黑體", Arial, sans-serif;
            background: #f7f7f7;
        }
        .sidebar {
            width: 220px;
            background: #001fac;
            height: 100vh;
            float: left;
            position: absolute;
            left: 0;
            top: 0;
        }
        .circle {
            width: 300px;
            height: 300px;
            background: #222;
            border-radius: 50%;
            position: absolute;
            left: 60px;
            top: 180px;
            border: 4px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle-text {
            color: #fff;
            font-size: 2em;
            text-align: center;
            line-height: 1.5;
        }
        .content {
            margin-left: 300px;
            padding: 60px;
        }
        table {
            border-collapse: collapse;
            font-size: 2em;
            margin-top: 60px;
        }
        th, td {
            border: 3px solid #444;
            padding: 16px 32px;
            text-align: center;
        }
        th {
            background: #f3f3f3;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="circle">
            <div class="circle-text">
                作業2<br>陳正祐
            </div>
        </div>
    </div>
    <div class="content">
        <div id="table-container"></div>
    </div>
    <script>
        // 二維陣列資料
        const data = [
            ["姓名", "國文", "英文", "數學"],
            ["王大同", 85, 88, 77],
            ["林麥可", 99, 86, 89],
            ["張淑芬", 75, 92, 86]
        ];

        // 產生表格
        function createTable(arr) {
            let html = "<table>";
            for (let i = 0; i < arr.length; i++) {
                html += "<tr>";
                for (let j = 0; j < arr[i].length; j++) {
                    if (i === 0) {
                        html += `<th>${arr[i][j]}</th>`;
                    } else {
                        html += `<td>${arr[i][j]}</td>`;
                    }
                }
                html += "</tr>";
            }
            html += "</table>";
            return html;
        }

        // 插入到網頁
        document.getElementById("table-container").innerHTML = createTable(data);
    </script>
</body>
</html>

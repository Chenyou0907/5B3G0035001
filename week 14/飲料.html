<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飲料清單</title>
</head>
<body>
    <script>
        document.write('<h2>飲料橫排清單</h2>');
        let drinks = ['紅茶','綠茶','青茶','烏龍茶','奶茶','可樂','雪碧','檸檬紅茶'];
        document.write('<table border="1">');

        document.write('<tr>');
        for(let i = 0; i < drinks.length; i++) {
            document.write('<td>飲料' + (i + 1) + '</td>');
        }
        document.write('</tr>');
        
        document.write('<tr>');
        for(let i = 0; i < drinks.length; i++) {
            document.write('<td>' + drinks[i] + '</td>');
        }
        document.write('</tr>');
        document.write('</table>');
        
        document.write('<h2>飲料直排清單</h2>');
        document.write('<table border="1">');
        for(let i = 0; i < drinks.length; i++) {
            document.write('<tr>');
            document.write('<td>飲料' + (i + 1) + '</td>');
            document.write('<td>' + drinks[i] + '</td>');
            document.write('</tr>');
        }
        document.write('</table>');
    </script>
</body>
</html>

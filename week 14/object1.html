<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="object1.css">
</head>
<body>
    <div class="container">
        <div id="result"></div>
    </div>
    <script>
        let man = new Object();
        function askName() {
            let name = "";
            while (!name) {
                name = prompt("請輸入您的名字：", "");
            }
            return name;
        }
        function askAge() {
            let age = null;
            while (age === null || isNaN(age) || age < 0 || age > 120) {
                age = prompt("請輸入您的年齡：", "");
            }
            return age;
        }
        man.name = askName();
        man.age = askAge();
        man.talk = function() {
            console.log("hello 你是" + this.name + "年齡" + this.age + "歲");
        };
        let voteMsg = man.age >= 18 ? "可以參加投票" : "不能參加投票";
        document.getElementById('result').innerHTML =
            "Hello 你是" + man.name + "，年齡" + man.age + "歲，<br>" +
            (man.age >= 18 ? "已成年" : "未成年") + "<br>" +
            voteMsg;
        man.talk();
    </script>
</body>
</html>

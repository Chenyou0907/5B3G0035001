<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物車練習</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .product {
            margin: 20px 0;
        }
        .product img {
            width: 200px;
            height: auto;
        }
        .cart-controls {
            position: fixed;
            top: 20px;
            right: 20px;
        }
        button {
            padding: 5px 10px;
            margin: 5px;
            cursor: pointer;
        }
        .price {
            font-size: 18px;
            margin: 10px 0;
        }
        #totalAmount {
            position: fixed;
            top: 60px;
            right: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        #cartItems {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 200px;
            background: #f9f9f9;
            padding: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div class="cart-controls">
        <button onclick="showTotal()">購物車總額</button>
        <button onclick="clearCart()">清空購物車</button>
    </div>


    <div id="totalAmount">總金額: $<span id="total">0</span></div>


    <div id="cartItems">
        <h3>購物車內容：</h3>
        <div id="itemsList"></div>
    </div>


    <div class="product">
        <img src="辛拉麵.jpg" alt="辛拉麵">
        <p class="price">$49</p>
        <button onclick="addToCart('辛拉麵', 49)">加入購物車</button>
    </div>

    <div class="product">
        <img src="滿漢.jpg" alt="滿漢大餐">
        <p class="price">$80</p>
        <button onclick="addToCart('滿漢大餐', 80)">加入購物車</button>
    </div>

    <div class="product">
        <img src="大乾麵.jpg" alt="大乾麵">
        <p class="price">$35</p>
        <button onclick="addToCart('大乾麵', 35)">加入購物車</button>
    </div>

    <script>
        let cartItems = [];
        let total = 0;

        window.onload = function() {
            loadCart();
        }

        function loadCart() {
            const savedCart = localStorage.getItem('cartItems');
            const savedTotal = localStorage.getItem('cartTotal');
            
            if (savedCart) {
                cartItems = JSON.parse(savedCart);
                total = parseInt(savedTotal || '0');
                updateCartDisplay();
                updateTotalDisplay();
            }
        }

        function saveCart() {
            localStorage.setItem('cartItems', JSON.stringify(cartItems));
            localStorage.setItem('cartTotal', total.toString());
        }
        
        function updateTotalDisplay() {
            document.getElementById('total').textContent = total;
        }

        function updateCartDisplay() {
            const itemsList = document.getElementById('itemsList');
            itemsList.innerHTML = cartItems.map(item => 
                `<div>${item.name} - $${item.price}</div>`
            ).join('');
        }

        function addToCart(name, price) {
            cartItems.push({ name, price });
            total += price;
            updateTotalDisplay();
            updateCartDisplay();
            saveCart();
            console.log(`已添加商品：${name}，價格：$${price}`);
            console.log(`當前購物車總額：$${total}`);
        }

        function showTotal() {
            console.log(`購物車總額：$${total}`);
            console.log('購物車內容：');
            cartItems.forEach(item => {
                console.log(`- ${item.name}: $${item.price}`);
            });
        }

        function clearCart() {
            cartItems = [];
            total = 0;
            updateTotalDisplay();
            updateCartDisplay();
            saveCart();
            console.log('購物車已清空');
        }
    </script>
</body>
</html>

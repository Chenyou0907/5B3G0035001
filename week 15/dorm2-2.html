<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HTML DOM 實際操作</title>
</head>
<body>
    <h1>HTML DOM 實際操作</h1>
    <div>畫面操作</div>
    <button onclick="change();">點我</button>
    <script>
        function change() {
            document.body.innerHTML = "新的內容";
        }
    </script>
</body>
</html>

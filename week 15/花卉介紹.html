<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>花卉介紹</title>
    <style>
        button {
            font-size: 20px;
            padding: 10px 20px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>花卉介紹</h1>
    <div id="content"></div>
    <button onclick="me();">康乃馨</button>
    <button onclick="School();">玫瑰</button>
    <script>
        function me() {

            let elem = document.querySelector("#content");
            elem.innerHTML = "康乃馨<br>又名香石竹，是石竹科石竹屬的植物。<br>它們以其豐富的色彩和芳香而受到人們的喜愛。<br>康乃馨的花語包括母愛、尊敬和感激之情。";
            elem.style.fontSize = "30px";
            elem.style.color = "pink";
        }

        function School() {

            let elem = document.querySelector("#content");
            elem.innerHTML = "玫瑰<br>是薔薇科薔薇屬的植物。<br>它們以其美麗的顏色和芳香而受到人們的喜愛。<br>玫瑰的花語包括愛情、浪漫和尊貴。";
            elem.style.fontSize = "30px";
            elem.style.color = "red";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁設計</title>
    <style>
        .topnav {
            overflow: hidden;
            background-color: #504f50;
        }

        .topnav a {
            float: left;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: #ddd;
            color: rgb(0, 0, 0);
        }

        .topnav a.active {
            background-color: #04AA6D;
            color: white;
        }
        
        /* 添加文字效果的樣式 */
        body {
            font-family: Arial Black, Arial, sans-serif;
        }

        .text-effects {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
        }

        .text {
            font-size: 60px;
            font-weight: bold;
            margin: 20px;
            padding: 10px;
        }

        .rainbow1 {
            background: linear-gradient(to right, cyan, lime, yellow, orange);
            color: black;
            -webkit-text-stroke: 1px black;
        }

        .rainbow2 {
            background: linear-gradient(to right, cyan, lime, yellow, orange);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .rainbow3 {
            background: linear-gradient(0deg, 
                #ffc400 0%, 
                #ffc400 50%, 
                #ff0000 50%, 
                #ff0000 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .city {
            background-image: url('https://source.unsplash.com/800x400/?city,night');
            background-size: cover;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a href="導覽列.html">首頁</a>
        <a class="active" href="網頁設計.html">網頁設計</a>
        <a href="專題.html">文字描邊效果</a>
        <a href="聯絡資訊.html">聯絡資訊</a>
    </div>

    <div style="padding: 20px;">
        <div class="text-effects">
            <h2>Background-clip 文字效果展示</h2>
            <div class="text rainbow1">HAVE A NICE DAY!</div>
            <div class="text rainbow2">HAVE A NICE DAY!</div>
            <div class="text rainbow3">HAVE A NICE DAY!</div>
            <div class="text city">HAVE A NICE DAY!</div>
        </div>
    </div>
</body>
</html>

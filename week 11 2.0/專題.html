<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專題製作</title>
    <style>
        .topnav {
            overflow: hidden;
            background-color: #504f50;
        }

        .topnav a {
            float: left;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: #ddd;
            color: rgb(0, 0, 0);
        }

        .topnav a.active {
            background-color: #04AA6D;
            color: white;
        }

        /* 文字描邊效果的樣式 */
        h1 {
            color: #0000;
            margin: 0;
            font-size: 80px;
            font-family: impact, arial-black;
            paint-order: stroke;
        }

        h1:nth-child(1) {
            -webkit-text-stroke: 2px red;
        }

        h1:nth-child(2) {
            -webkit-text-stroke: 3px yellowgreen;
        }

        h1:nth-child(3) {
            -webkit-text-stroke: 5px orange;
        }

        .text-container {
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a href="導覽列.html">首頁</a>
        <a href="網頁設計.html">網頁設計</a>
        <a class="active" href="專題.html">文字描邊效果</a>
        <a href="聯絡資訊.html">聯絡資訊</a>
    </div>

    <div style="padding: 20px;">
        <h2>專題製作 - 文字描邊效果</h2>
        <div class="text-container">
            <h1>APPLE</h1>
            <h1>BANANA</h1>
            <h1>ORANGE</h1>
        </div>
    </div>
</body>
</html>

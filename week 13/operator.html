<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //算數運算
        let x=7%3
        console.log(x);
        //指定運算
        x+1;
        console.log(x);
        //比較運算
        x=3>4;
        console.log(x);
        //單元運算!,++,--
        x=!x;
        console.log(x);
        x++;//會捯到甚麼
        //邏輯運算&&,||
        let test=true||false;
        console.log(test);
    </script>
</body>
</html>
